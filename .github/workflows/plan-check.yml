name: plan

# The pipeline's rule for every pull request (docs/32): it closes an issue or
# says why not, and any new decision takes a D number main has not used.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The pull request closes an issue; its D numbers are new
        run: python3 tools/plan.py check-pr
