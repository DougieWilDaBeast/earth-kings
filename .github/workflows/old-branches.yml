name: old-branches

# One-off, run by hand: deletes the branches dougie approved for deletion on
# 2026-10-14 (.github/old-branches.txt). Safe to run again; gone ones are skipped.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Delete the approved old branches
        run: python3 tools/plan.py delete-branches .github/old-branches.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
