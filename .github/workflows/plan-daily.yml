name: plan-daily

# Once a day and on every merge to main: unsorted issues are labelled
# "needs sort", and the status issue is rewritten (docs/32).
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sort-and-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Label unsorted issues
        run: python3 tools/plan.py sort
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rewrite the status issue
        run: python3 tools/plan.py status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
